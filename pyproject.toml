[project]
name = "callmemaybe"
version = "1.0.0"
requires-python = ">=3.10"
description = "Basic natural language processing with LLMs"
readme = "README.md"
authors = [
    {name = "alvespin"}
]
dependencies = [
    "numpy",
    "pydantic",
    "flake8",
    "mypy",
    "llm-sdk",
    "accelerate",
]

[tool.uv]
package = false

[tool.uv.sources]
llm-sdk = { path = "llm_sdk", editable = true }

[tool.mypy]
exclude = [
  ".venv",
  "llm_sdk",
  "tests",
]